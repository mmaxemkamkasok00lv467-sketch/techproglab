<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка товара | Магазин электроники</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="product-container">
    <article class="product-card">
      <div class="product-card__badge">-20%</div>
      <div class="product-card__image-box">
        <span class="product-card__emoji">💻</span>
      </div>
      <div class="product-card__content">
        <div class="product-card__category">Ультрабук для разработки</div>
        <h2 class="product-card__title">ZenBook Pro 14 OLED</h2>
        <div class="product-card__rating">★★★★★ <span class="product-card__reviews">(89 отзывов)</span></div>
        <div class="product-card__pricing">
          <span class="product-card__price-new">79 990 ₽</span>
          <span class="product-card__price-old">99 990 ₽</span>
        </div>
        <button class="product-card__btn" onclick="alert('Товар добавлен в корзину!')">В корзину</button>
      </div>
    </article>
  </div>
</body>
</html>
