<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор расхода топлива</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    header, footer { text-align: center; color: #94a3b8; font-size: 13px; }
    main { display: flex; justify-content: center; align-items: center; flex: 1; }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: 20px;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }
    h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #0284c7; color: #fff; }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #0f172a;
      text-align: center;
      font-size: 15px;
      display: none;
    }
    .result_error { color: #f87171; border: 1px solid #ef4444; }
    .result_success { color: #34d399; border: 1px solid #10b981; }
  </style>
</head>
<body>
  <header>Практикум · Технология программирования</header>

  <main>
    <section class="card">
      <h1>⛽ Расход топлива на 100 км</h1>
      <p class="subtitle">Введите пройденный путь и объём заправленного топлива</p>

      <div class="field">
        <label for="distance">Пройденное расстояние (км)</label>
        <input type="number" id="distance" placeholder="Например: 350" step="any">
      </div>

      <div class="field">
        <label for="fuel">Израсходовано топлива (л)</label>
        <input type="number" id="fuel" placeholder="Например: 28.5" step="any">
      </div>

      <div class="field">
        <label for="price">Цена за 1 литр, ₽ (необязательно)</label>
        <input type="number" id="price" placeholder="Например: 58.5" step="any">
      </div>

      <button type="button" onclick="calculateFuel()">Рассчитать расход</button>

      <div id="output" class="result"></div>
    </section>
  </main>

  <footer>Разработал: Мурманцев М. А. · 2026</footer>

  <script>
    function calculateFuel() {
      const distVal = document.getElementById('distance').value.trim();
      const fuelVal = document.getElementById('fuel').value.trim();
      const priceVal = document.getElementById('price').value.trim();
      const output = document.getElementById('output');

      output.style.display = 'block';

      if (distVal === '' || fuelVal === '') {
        output.className = 'result result_error';
        output.innerText = 'Ошибка: заполните расстояние и объём топлива.';
        return;
      }

      const distance = Number(distVal);
      const fuel = Number(fuelVal);
      const price = priceVal === '' ? 0 : Number(priceVal);

      if (isNaN(distance) || isNaN(fuel) || isNaN(price) || distance <= 0 || fuel < 0 || price < 0) {
        output.className = 'result result_error';
        output.innerText = 'Ошибка: введите корректные положительные числа (расстояние > 0).';
        return;
      }

      const consumption = (fuel / distance) * 100;
      let message = `Средний расход: ${consumption.toFixed(2)} л / 100 км`;

      if (price > 0) {
        const totalCost = fuel * price;
        const costPerKm = totalCost / distance;
        message += `\nСтоимость поездки: ${totalCost.toFixed(2)} ₽ (${costPerKm.toFixed(2)} ₽/км)`;
      }

      output.className = 'result result_success';
      output.innerText = message;
    }
  </script>
</body>
</html>
